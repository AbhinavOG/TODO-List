<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus — To-Do List</title>
<meta name="description" content="A calm, minimal to-do list with filters, inline editing, and local persistence." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="app-header">
    <div class="eyebrow"><span class="bar"></span>Personal Project</div>
    <h1>Focus</h1>
    <p>A calm place to track what matters today.</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-top">
      <span class="count" id="progressCount">0 of 0 done</span>
      <span class="pct mono" id="progressPct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="addInput" placeholder="Add a task and press enter…" autocomplete="off" maxlength="140" />
    <button type="submit" class="add-btn" aria-label="Add task">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All <span class="n mono" id="countAll">0</span></button>
    <button class="filter-btn" data-filter="active">Active <span class="n mono" id="countActive">0</span></button>
    <button class="filter-btn" data-filter="done">Done <span class="n mono" id="countDone">0</span></button>
    <button class="clear-btn" id="clearBtn" disabled>Clear completed</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <h3 id="emptyTitle">Nothing here yet</h3>
    <p id="emptyDesc">Add your first task above to get started.</p>
  </div>

  <footer>Tasks are saved locally in your browser.</footer>
</div>

<script src="script.js"></script>
</body>
</html>
